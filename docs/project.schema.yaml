# What project.yaml may contain. Every rule JSON Schema can express lives here (ADR-0001), and scripts/check_project_yaml.py
# loads files, runs this schema and words its errors. The checker holds only the rules JSON Schema can't
# express: a name in two of env, secrets and shared, a database setting listed without its engine (or the
# reverse), an object storage setting in env or shared, and a domain's host and path declared twice across
# projects. Stricter than terraform/modules/project
# on purpose: per-environment secrets, shared secrets and volumes are rejected, and only staging and
# production exist.
$schema: https://json-schema.org/draft/2020-12/schema
title: project.yaml
type: object
additionalProperties: false
required: [repo, defaults, environments]
properties:
  repo:
    type: string
  image:
    type: string
  defaults:
    type: object
    additionalProperties: false
    required: [env, secrets, shared, databases]
    properties:
      env:
        $ref: "#/$defs/env"
      secrets:
        type: array
        uniqueItems: true
        items:
          type: string
      shared:
        type: array
        uniqueItems: true
        items:
          type: string
      # Engine => its settings. The keys each engine writes are in scripts/check_project_yaml.py
      # (DATABASE_KEYS) and terraform/modules/project/databases.tf.
      databases:
        type: object
        additionalProperties: false
        properties:
          postgres:
            $ref: "#/$defs/backedUpDatabase"
          redis:
            $ref: "#/$defs/database"
      volumes:
        type: object
        additionalProperties:
          type: string
  environments:
    type: object
    additionalProperties: false
    required: [staging, production]
    properties:
      staging:
        $ref: "#/$defs/environment"
      production:
        $ref: "#/$defs/environment"

$defs:
  env:
    type: object
    additionalProperties:
      type: string
      pattern: "^[^\\r\\n]*$"

  database:
    type: object
    additionalProperties: false
    properties:
      image:
        type: string
        minLength: 1

  # An engine whose production database is backed up: postgres, and mongo once modules/project has it.
  # Backed up whether backups is there or not: it only changes the schedule (default 0 0 * * *, UTC) and
  # how many dumps are kept (default 30, at least 7). terraform/modules/project/databases.tf.
  backedUpDatabase:
    type: object
    additionalProperties: false
    properties:
      image:
        type: string
        minLength: 1
      backups:
        type: object
        additionalProperties: false
        properties:
          # Five cron fields, numbers only: minute hour day-of-month month day-of-week.
          schedule:
            type: string
            pattern: "^[0-9*,/-]+( [0-9*,/-]+){4}$"
          # At least 7: with a frequent schedule, fewer can replace the last good dump within hours.
          keep:
            type: integer
            minimum: 7

  environment:
    type: object
    additionalProperties: false
    properties:
      env:
        $ref: "#/$defs/env"
      domains:
        type: object
        additionalProperties:
          $ref: "#/$defs/domain"

  domain:
    type: object
    additionalProperties: false
    required: [port]
    properties:
      port:
        type: integer
        minimum: 1
        maximum: 65535
      https:
        type: boolean
      certificate_type:
        enum: [letsencrypt, none, custom]
      custom_cert_resolver:
        type: string
      path:
        type: string
        pattern: "^/"
      internal_path:
        type: string
        pattern: "^/"
      strip_path:
        type: boolean
      enabled:
        type: boolean
      forward_auth_enabled:
        type: boolean
      custom_entrypoint:
        type: string
    allOf:
      # custom needs a resolver.
      - if:
          properties:
            certificate_type:
              const: custom
          required: [certificate_type]
        then:
          required: [custom_cert_resolver]
      # A resolver without certificate_type custom is an error, reported at custom_cert_resolver.
      - if:
          not:
            properties:
              certificate_type:
                const: custom
            required: [certificate_type]
        then:
          properties:
            custom_cert_resolver:
              not: {}
      # https: false serves no certificate, so only none is allowed.
      - if:
          properties:
            https:
              const: false
          required: [https]
        then:
          properties:
            certificate_type:
              enum: [none]
