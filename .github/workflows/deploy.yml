# A deploy request: put a project environment on an image tag, and apply it, in one run. Started by app
# repos (kthaisociety/workflows' request-deploy.yml, with the kthais-dispatch App) or by hand (Actions →
# deploy → Run workflow). The run's result is the deploy's result.
#
#  1. Validate the inputs; the project and environment must exist here.
#  2. Resolve the tag's digest from GHCR. The caller never names bytes, so it can't pair an approved tag
#     with other ones.
#  3. Production: the tag must be X.Y.Z, the project's repo must have the GitHub Release vX.Y.Z, and the
#     digest must be the one built from the commit it points to (sha-<7>).
#  4. Commit the one line to release.yaml on main, as kthais-deploy, through GitHub's API (so GitHub signs
#     it). Unless it's already there. Only this workflow changes release.yaml.
#  5. Apply main, here, and end with the result. If, at the applied commit, the line is a newer one, a
#     later deploy replaced this one before it was applied: success, with a warning.
name: deploy
run-name: deploy ${{ inputs.project }} ${{ inputs.environment }} ${{ inputs.tag }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project, as in projects/<project>/.
        required: true
        type: string
      environment:
        description: Environment, e.g. staging or production.
        required: true
        type: string
      tag:
        description: Image tag, sha-<7> (staging) or X.Y.Z (a release).
        required: true
        type: string
      request_id:
        description: The caller's id for this request, so it can find this run. Any value when run by hand.
        required: true
        type: string

permissions:
  contents: read

# The same group as tofu.yml's applies: one apply at a time (no state locking on GleSYS). GitHub keeps only
# one pending run per group: a third request arriving while one runs and one waits cancels the waiting
# one. Its caller then sees "cancelled" and can re-run; nothing was committed for it.
concurrency:
  group: tofu-apply
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOFU_VERSION: 1.12.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token for OpenBao
    env:
      PROJECT: ${{ inputs.project }}
      ENVIRONMENT: ${{ inputs.environment }}
      TAG: ${{ inputs.tag }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Validate the request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          grep -qxE '[a-z0-9]+(-[a-z0-9]+)*' <<<"$PROJECT" || fail "project '$PROJECT': not a project name"
          grep -qxE '[a-z0-9]+' <<<"$ENVIRONMENT" || fail "environment '$ENVIRONMENT': not an environment name"
          grep -qxE 'sha-[0-9a-f]{7}|[0-9]+\.[0-9]+\.[0-9]+' <<<"$TAG" || fail "tag '$TAG': must be sha-<7 hex> or X.Y.Z"
          grep -qxE '[A-Za-z0-9._-]{1,64}' <<<"$REQUEST_ID" || fail "request_id: 1-64 letters, digits, . _ -"

          p="projects/$PROJECT/project.yaml"; r="projects/$PROJECT/release.yaml"
          [ -f "$p" ] || fail "no project '$PROJECT' here (projects/$PROJECT/project.yaml)"
          [ "$(E="$ENVIRONMENT" yq -r '.environments | has(strenv(E))' "$p")" = true ] || fail "$PROJECT has no environment '$ENVIRONMENT'"
          [ "$(E="$ENVIRONMENT" yq -r 'has(strenv(E))' "$r")" = true ] || fail "$r has no line for '$ENVIRONMENT'"

          repo=$(yq -r '.repo' "$p")
          image=$(yq -r ".image // \"ghcr.io/$repo\"" "$p" | tr '[:upper:]' '[:lower:]')
          path=${image#ghcr.io/}

          # GHCR, anonymously: the images are public. HEAD the tag, read its digest.
          token=$(curl -sSf "https://ghcr.io/token?scope=repository:$path:pull" | jq -r .token)
          digest_of() {
            curl -sS -o /dev/null -D - -I -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$path/manifests/$1" | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" {print $2}'
          }
          digest=$(digest_of "$TAG")
          grep -qxE 'sha256:[0-9a-f]{64}' <<<"$digest" || fail "$image:$TAG not found in GHCR"

          if [ "$ENVIRONMENT" = production ]; then
            grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' <<<"$TAG" || fail "production only takes releases (X.Y.Z), not $TAG"
            # Releases are tagged vX.Y.Z (release-please with include-component-in-tag: false).
            gh api "repos/$repo/releases/tags/v$TAG" --jq .tag_name >/dev/null 2>&1 || fail "$repo has no GitHub Release v$TAG"
            commit=$(gh api "repos/$repo/commits/v$TAG" --jq .sha) || fail "can't resolve v$TAG in $repo"
            built=$(digest_of "sha-${commit::7}")
            [ "$built" = "$digest" ] || fail "$image:$TAG is $digest, but the release commit ${commit::7} was built as ${built:-nothing}"
          fi

          line="$image:$TAG@$digest"
          current=$(E="$ENVIRONMENT" yq -r '.[strenv(E)] // ""' "$r")
          {
            echo "line=$line"
            echo "file=$r"
            echo "unchanged=$([ "$current" = "$line" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Request OK: $PROJECT $ENVIRONMENT → \`$line\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.request.outputs.unchanged != 'true'
        id: app
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          repositories: deployments
          permission-contents: write

      - name: Commit the line to main
        if: steps.request.outputs.unchanged != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LINE: ${{ steps.request.outputs.line }}
          FILE: ${{ steps.request.outputs.file }}
        run: |
          repo="$GITHUB_REPOSITORY"
          # Read, edit one line, write with the blob's sha: if main moved in between, GitHub refuses (409)
          # and it's done again on the new main.
          for _ in 1 2 3 4 5; do
            blob=$(gh api "repos/$repo/contents/$FILE?ref=main" --jq .sha)
            gh api -H 'Accept: application/vnd.github.raw' "repos/$repo/contents/$FILE?ref=main" > /tmp/release.yaml
            E="$ENVIRONMENT" L="$LINE" yq -i '.[strenv(E)] = strenv(L)' /tmp/release.yaml
            if commit=$(gh api -X PUT "repos/$repo/contents/$FILE" \
                -f message="chore(deploy): $PROJECT $ENVIRONMENT $TAG" -f branch=main -f sha="$blob" \
                -f content="$(base64 -w0 /tmp/release.yaml)" --jq .commit.sha 2> /tmp/put.err); then
              echo "Committed $commit: $FILE $ENVIRONMENT → $LINE" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Commit refused, retrying on the new main: $(cat /tmp/put.err)"
            sleep 5
          done
          echo "::error::Couldn't commit to main after 5 attempts: $(cat /tmp/put.err)"
          exit 1

      # Apply whatever main is now: it contains this deploy (and maybe newer commits, which is fine).
      - name: Check out main as it is now
        run: |
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          echo "APPLIED=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: GitHub OIDC token for OpenBao
        run: |
          JWT=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://bao.kthais.com" | jq -r .value)
          echo "::add-mask::$JWT"
          echo "TF_VAR_openbao_jwt=$JWT" >> "$GITHUB_ENV"

      - name: tofu apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          tofu init
          tofu apply -auto-approve

      - name: Result
        env:
          LINE: ${{ steps.request.outputs.line }}
          FILE: ${{ steps.request.outputs.file }}
        run: |
          now=$(E="$ENVIRONMENT" yq -r '.[strenv(E)] // ""' "$FILE")
          if [ "$now" = "$LINE" ]; then
            echo "Deployed: $PROJECT $ENVIRONMENT runs \`$LINE\` (applied $APPLIED)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Replaced before it was applied: $PROJECT $ENVIRONMENT runs $now, a newer deploy."
            echo "Superseded: $PROJECT $ENVIRONMENT runs \`$now\` (a newer deploy), not \`$LINE\`." >> "$GITHUB_STEP_SUMMARY"
          fi
